    <script>
        function filterTable() {
            const filter = document.getElementById('filter-input').value.toLowerCase();
            const rows = document.querySelectorAll('tbody tr');
			
            rows.forEach(row => {
                const fileName = row.cells[0].textContent.toLowerCase();
                row.style.display = fileName.includes(filter) ? '' : 'none';
            });
        }

document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.download-btn').forEach(button => {
        button.addEventListener('click', function () {

            const row = this.closest('tr');

            const fileType = row.querySelector('.file-format-select').value;
            const fileID = row.querySelector('.hidden-id').value;

            if (fileID) {
                const downloadURL = `${fileID}&type=code&format=${fileType}`;
                window.location.href = downloadURL;
            }
        });
    });
});
